name: Sinyal botu (Telegram)

on:
  schedule:
    - cron: "1,16,31,46 * * * *"   # her 15m mum kapanışından ~1 dk sonra (GitHub birkaç dakika gecikebilir)
  workflow_dispatch:                # Actions sekmesinden elle de çalıştırılabilir

concurrency:
  group: sinyal-botu
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install "ccxt>=4.3" "pandas>=2.0" "numpy>=1.24"
      - name: Önceki durumu yükle (gönderilen sinyaller)
        uses: actions/cache/restore@v4
        with:
          path: state
          key: sinyal-state-${{ github.run_id }}
          restore-keys: sinyal-state-
      - name: Tara, Telegram'a gönder, demo hesabı yönet ve mesajları cevapla (~5,5 saat)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ANI_TOKEN: ${{ secrets.TELEGRAM_ANI_TOKEN }}
          CAPITAL: ${{ secrets.CAPITAL }}
        run: python -u signal_bot.py --state state/sent.json --loop 19500
      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: sinyal-state-${{ github.run_id }}
      - name: Demo hesabı siteye yayınla (demo-data dalı)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f state/paper.json ]; then
            mkdir -p /tmp/pub && cp state/paper.json /tmp/pub/ && cd /tmp/pub
            git init -q -b demo-data
            git add paper.json
            git -c user.name="demo-bot" -c user.email="demo-bot@users.noreply.github.com" commit -q -m "demo hesap"
            git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" demo-data
          fi
      - name: Bir sonraki çalışmayı başlat (kesintisiz zincir)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run sinyal.yml --ref main -R "${{ github.repository }}"
